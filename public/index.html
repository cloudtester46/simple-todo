<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="hero">
        <p class="eyebrow">Stay on track</p>
        <h1 id="app-title">Simple Todo</h1>
        <p class="intro">Add your tasks, tick them off, and keep your day moving.</p>
      </section>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">New task</label>
        <input id="todo-input" name="todo" type="text" placeholder="What needs doing?" maxlength="120" required />
        <button type="submit">Add</button>
      </form>

      <section class="panel" aria-live="polite">
        <div class="summary">
          <span id="task-count">No tasks yet</span>
          <button id="clear-done" class="ghost" type="button">Clear done</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-state" class="empty">Your list is clear. Add your first task above.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
